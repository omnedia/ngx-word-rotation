<div class="om-rotating-word" [ngClass]="styleClass" [ngStyle]="style()" [class.reverse]="reverseAnimation"
     #OmWordRotationWrapper>
  @for (word of words; track $index) {
    <p
      [class.active]="$index === activeIndex()"
      [class.inactive]="$index === inactiveIndex()"
      #OmRotatingWords
    >
      {{ word }}
    </p>
  }

  <span>{{ longestWord() }}</span>
</div>
